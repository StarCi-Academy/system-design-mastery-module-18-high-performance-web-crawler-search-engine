server:
  port: ${PORT:3000}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/frontier}
    username: ${SPRING_DATASOURCE_USERNAME:frontier}
    password: ${SPRING_DATASOURCE_PASSWORD:frontier}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

bloom:
  capacity: ${BLOOM_CAPACITY:100000}
  errorRate: ${BLOOM_ERROR_RATE:0.01}
