name: url-frontier-bloom-java

services:
  postgres:
    image: postgres:16-alpine
    container_name: url-frontier-bloom-java-postgres
    environment:
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier
      POSTGRES_DB: frontier
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier -d frontier"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - frontier-network

  redis:
    image: redislabs/rebloom:latest
    container_name: url-frontier-bloom-java-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - frontier-network

  frontier-service:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: url-frontier-bloom-java-service
    environment:
      PORT: 3000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/frontier
      SPRING_DATASOURCE_USERNAME: frontier
      SPRING_DATASOURCE_PASSWORD: frontier
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BLOOM_CAPACITY: 100000
      BLOOM_ERROR_RATE: 0.01
    ports:
      - "3005:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontier-network

networks:
  frontier-network:
    driver: bridge
