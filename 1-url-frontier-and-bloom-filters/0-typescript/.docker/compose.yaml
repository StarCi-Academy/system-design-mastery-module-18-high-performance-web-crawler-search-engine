name: url-frontier-bloom-ts

services:
  postgres:
    image: postgres:16-alpine
    container_name: url-frontier-bloom-ts-postgres
    environment:
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier
      POSTGRES_DB: frontier
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier -d frontier"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - frontier-network

  redis:
    image: redislabs/rebloom:latest
    container_name: url-frontier-bloom-ts-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - frontier-network

  frontier-service:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: url-frontier-bloom-ts-service
    environment:
      PORT: 3000
      POSTGRES_URL: postgres://frontier:frontier@postgres:5432/frontier
      REDIS_URL: redis://redis:6379
      BLOOM_CAPACITY: 100000
      BLOOM_ERROR_RATE: 0.01
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontier-network

networks:
  frontier-network:
    driver: bridge
